<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Chaîne de calcul de la production d’hydrogène par radiolyse</title>
  <desc id="desc">La puissance absorbée dans une cuve d’eau produit des molécules d’hydrogène, converties en moles puis en débit volumique.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".58"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity=".22"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="430" rx="24" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">De l’énergie déposée au débit de H₂</text>

  <g transform="translate(55 85)">
    <rect x="0" y="0" width="220" height="255" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <path d="M25 65h75M18 95h90M35 125h65" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M135 38h55v120c0 45-55 45-55 0z" fill="url(#water)" stroke="#0284c7" stroke-width="3"/>
    <circle cx="151" cy="125" r="7" fill="#fff"/><circle cx="176" cy="104" r="6" fill="#fff"/><circle cx="162" cy="75" r="5" fill="#fff"/>
    <text x="110" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#9a3412">Puissance absorbée</text>
    <text x="110" y="232" text-anchor="middle" font-family="serif" font-size="23" fill="#0f172a">P<tspan baseline-shift="sub" font-size="15">abs</tspan> [J·s⁻¹]</text>
  </g>

  <line x1="292" y1="212" x2="385" y2="212" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="338" y="188" text-anchor="middle" font-family="serif" font-size="18" fill="#334155">G(H₂)/E₁₀₀</text>

  <g transform="translate(395 85)">
    <rect width="220" height="255" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="70" cy="88" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="150" cy="88" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="96" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">H₂</text>
    <text x="150" y="96" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">H₂</text>
    <text x="110" y="170" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Molécules produites</text>
    <text x="110" y="205" text-anchor="middle" font-family="serif" font-size="22" fill="#0f172a">Ṅ<tspan baseline-shift="sub" font-size="14">H₂</tspan></text>
    <text x="110" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">molécules·s⁻¹</text>
  </g>

  <line x1="632" y1="212" x2="725" y2="212" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="678" y="188" text-anchor="middle" font-family="serif" font-size="18" fill="#334155">÷ N<tspan baseline-shift="sub" font-size="12">A</tspan></text>

  <g transform="translate(735 85)">
    <rect width="310" height="255" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <path d="M70 116c0-48 40-74 85-74s85 26 85 74v45c0 35-170 35-170 0z" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <ellipse cx="155" cy="161" rx="85" ry="24" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <text x="155" y="107" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#166534">H₂(g)</text>
    <text x="155" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#14532d">Débit volumique</text>
    <text x="155" y="233" text-anchor="middle" font-family="serif" font-size="22" fill="#0f172a">Q<tspan baseline-shift="sub" font-size="14">v</tspan> = ṅ RT/P</text>
  </g>
  <text x="550" y="392" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Énergie → molécules → moles → volume aux conditions (P,T)</text>
</svg>
