<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Cuve rectangulaire et surface d’échange verticale</title>
  <desc id="desc">Une cuve de dimensions L, l et H contient un liquide jusqu’à la hauteur y. Une paroi verticale de surface L fois y est chauffée.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0.68"/>
    </linearGradient>
    <style>
      .edge { fill: none; stroke: #243447; stroke-width: 4; stroke-linejoin: round; }
      .hidden { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .measure { fill: none; stroke: #2563eb; stroke-width: 3; }
      .label { fill: #172033; font: 25px sans-serif; }
      .small { fill: #334155; font: 21px sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Volume de liquide. -->
  <path d="M210 360 L565 360 L710 285 L355 285 Z" fill="#bae6fd" fill-opacity="0.78"/>
  <path d="M210 360 L565 360 L565 510 L210 510 Z" fill="url(#water)"/>
  <path d="M565 360 L710 285 L710 435 L565 510 Z" fill="#0ea5e9" fill-opacity="0.68"/>

  <!-- Paroi verticale chauffée, aire L*y. -->
  <path d="M210 360 L565 360 L565 510 L210 510 Z" fill="url(#heat)"/>

  <!-- Cuve complète. -->
  <path class="edge" d="M210 120 L565 120 L710 45 L355 45 Z"/>
  <path class="edge" d="M210 120 L210 510 L565 510 L710 435 L710 45"/>
  <line class="edge" x1="565" y1="120" x2="565" y2="510"/>
  <line class="hidden" x1="355" y1="45" x2="355" y2="435"/>
  <line class="hidden" x1="355" y1="435" x2="710" y2="435"/>
  <line class="hidden" x1="210" y1="510" x2="355" y2="435"/>

  <!-- Niveau du liquide. -->
  <path class="edge" d="M210 360 L565 360 L710 285 L355 285 Z" stroke-width="2.5"/>

  <!-- Dimensions. -->
  <line class="measure" x1="210" y1="555" x2="565" y2="555" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="590">L</text>

  <line class="measure" x1="600" y1="535" x2="735" y2="465" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="682" y="535">ℓ</text>

  <line class="measure" x1="160" y1="505" x2="160" y2="125" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="125" y="320">H</text>

  <line class="measure" x1="185" y1="505" x2="185" y2="365" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="175" y="445">y</text>

  <text class="label" x="280" y="430">Séch(y) = L y</text>
  <text class="small" x="585" y="245">liquide à T(t)</text>
  <text class="small" x="270" y="95">paroi / milieu chaud à Tₚ</text>
</svg>

