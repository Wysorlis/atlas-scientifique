<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">Pressurisation thermique d'un liquide confiné</title>
  <desc id="desc">Deux récipients cylindriques fermés et entièrement remplis sont chauffés. Le premier est rigide. Le second se dilate thermiquement, ce qui réduit la hausse de pression.</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b94d45"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4477a5"/></marker>
    <style>
      .wall { fill: #cfd6de; stroke: #586473; stroke-width: 3; }
      .liquid { fill: #70a8d3; fill-opacity: .7; stroke: #39749e; stroke-width: 2; }
      .heat { stroke: #b94d45; stroke-width: 3; marker-end: url(#arrow-red); }
      .pressure { stroke: #4477a5; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .expansion { stroke: #7c5c99; stroke-width: 2.4; marker-end: url(#arrow-blue); stroke-dasharray: 6 4; }
      .label { font: 17px system-ui, sans-serif; fill: #263442; }
      .small { font: 15px system-ui, sans-serif; fill: #526170; }
      .math { font: italic 19px Georgia, serif; fill: #263442; }
    </style>
  </defs>
  <rect x="0" y="0" width="860" height="430" rx="14" fill="#f7f9fc"/>
  <text class="label" x="145" y="35">Paroi parfaitement rigide</text>
  <rect class="wall" x="155" y="75" width="190" height="275" rx="12"/>
  <rect class="liquid" x="173" y="93" width="154" height="239" rx="4"/>
  <text class="label" x="214" y="218">liquide</text>
  <line class="heat" x1="85" y1="145" x2="155" y2="145"/>
  <line class="heat" x1="85" y1="210" x2="155" y2="210"/>
  <line class="heat" x1="85" y1="275" x2="155" y2="275"/>
  <text class="math" x="88" y="120">Q̇</text>
  <line class="pressure" x1="245" y1="135" x2="245" y2="90"/>
  <line class="pressure" x1="245" y1="290" x2="245" y2="334"/>
  <line class="pressure" x1="205" y1="210" x2="174" y2="210"/>
  <line class="pressure" x1="285" y1="210" x2="326" y2="210"/>
  <text class="math" x="268" y="130">P ↑↑</text>
  <text class="small" x="128" y="385">dV = 0</text>
  <text class="small" x="228" y="385">dP/dT = αℓ/κₜ</text>
  <text class="label" x="527" y="35">Paroi thermiquement dilatable</text>
  <rect class="wall" x="550" y="68" width="218" height="289" rx="12"/>
  <rect class="liquid" x="569" y="87" width="180" height="251" rx="4"/>
  <rect x="575" y="93" width="168" height="239" rx="4" fill="none" stroke="#7c5c99" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="label" x="624" y="218">liquide</text>
  <line class="heat" x1="475" y1="145" x2="550" y2="145"/>
  <line class="heat" x1="475" y1="210" x2="550" y2="210"/>
  <line class="heat" x1="475" y1="275" x2="550" y2="275"/>
  <text class="math" x="478" y="120">Q̇</text>
  <line class="expansion" x1="550" y1="112" x2="522" y2="95"/>
  <line class="expansion" x1="768" y1="112" x2="796" y2="95"/>
  <line class="expansion" x1="550" y1="315" x2="522" y2="334"/>
  <line class="expansion" x1="768" y1="315" x2="796" y2="334"/>
  <text class="math" x="675" y="130">P ↑</text>
  <text class="small" x="515" y="385">dV/V = 3αᴸ dT</text>
  <text class="small" x="640" y="410">dP/dT = (αℓ − 3αᴸ)/κₜ</text>
</svg>
