<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Cercle tangent à deux paraboles décalées</title>
  <desc id="desc">Pour h égal à un, un cercle centré sur l’axe horizontal est tangent à la parabole y égale x carré et à la parabole y égale x carré moins un. Les rayons vers les points de contact sont normaux aux paraboles.</desc>
  <defs>
    <style>
      .axis { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-gray); }
      .curve1 { fill: none; stroke: #2563eb; stroke-width: 4; }
      .curve2 { fill: none; stroke: #7c3aed; stroke-width: 4; }
      .circle { fill: #fef3c7; fill-opacity: .45; stroke: #d97706; stroke-width: 4; }
      .normal { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .point { fill: #172033; }
      .label { fill: #172033; font: 24px sans-serif; }
      .small { fill: #334155; font: 20px sans-serif; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Axes, origine (250,300), échelle commune 210 px/unité. -->
  <line class="axis" x1="115" y1="300" x2="760" y2="300"/>
  <line class="axis" x1="250" y1="545" x2="250" y2="45"/>
  <text class="label" x="770" y="307">x</text>
  <text class="label" x="237" y="35">y</text>

  <!-- y = x^2. -->
  <path class="curve1" d="M166 266.4 C205 294 232 302 250 300 C302 296 347 255 376 224.4 C413 184 447 111 481 45.9"/>
  <!-- y = x^2 - 1. -->
  <path class="curve2" d="M166 476.4 C205 504 232 512 250 510 C302 506 347 465 376 434.4 C413 394 447 321 481 255.9 C500 216 514 181 523 155.1"/>

  <!-- Cercle pour h=1 : centre (0.6668173,0), rayon 0.2957757. -->
  <circle class="circle" cx="390.032" cy="300" r="62.113"/>

  <!-- Normales/rayons vers P1 et P2. -->
  <line class="normal" x1="390.032" y1="300" x2="347.716" y2="254.531"/>
  <line class="normal" x1="390.032" y1="300" x2="444.701" y2="329.483"/>

  <circle class="point" cx="390.032" cy="300" r="5"/>
  <circle class="point" cx="347.716" cy="254.531" r="5"/>
  <circle class="point" cx="444.701" cy="329.483" r="5"/>

  <text class="label" x="397" y="290">C</text>
  <text class="label" x="305" y="246">P₁</text>
  <text class="label" x="452" y="350">P₂</text>
  <text class="label" x="505" y="82">f₁(x)=x²</text>
  <text class="label" x="535" y="224">f₂(x)=x²−h</text>
  <text class="small" x="555" y="520">Illustration : h=1</text>
</svg>

